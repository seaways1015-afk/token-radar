# 推送 v* 标签时，在 GitHub 上自动打包 Windows / macOS / Linux 安装包并发布到 Releases
#   git tag v0.2.0 && git push origin v0.2.0
# 标签版本号需与 package.json 的 version 一致
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有代码签名证书：跳过签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
